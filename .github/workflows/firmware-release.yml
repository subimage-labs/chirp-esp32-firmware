name: firmware-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing is built or published unless CI is green on this exact commit
  # and (for a tag) the tag is the version that version.py stamps.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: CI succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deadline=$(( $(date +%s) + 2100 ))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100")
            ok=$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs")
            pending=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$ok" -gt 0 ]; then
              echo "ci.yml succeeded on $GITHUB_SHA"
              exit 0
            fi
            if [ "$pending" -eq 0 ]; then
              echo "::error::ci.yml has no successful run on $GITHUB_SHA"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci.yml is still running on $GITHUB_SHA"
              exit 1
            fi
            echo "ci.yml is still running; waiting"
            sleep 30
          done

      # firmware/version.py stamps FW_VERSION with `git describe --tags
      # --always --dirty` from firmware/ (when the FW_VERSION variable is
      # unset). The release job checks the stamped header again after the build.
      - name: Tag matches the firmware version
        if: github.ref_type == 'tag'
        run: |
          set -eu
          version=$(git -C firmware describe --tags --always --dirty)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but firmware/version.py would stamp $version"
            exit 1
          fi

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -d firmware

      - name: Tag matches the stamped firmware version
        if: github.ref_type == 'tag'
        run: |
          set -eu
          for env in t-embed-cc1101 t-deck; do
            stamped=$(sed -n 's/^#define FW_VERSION "\(.*\)"$/\1/p' "firmware/.pio/build/$env/fw_version.h")
            if [ "$stamped" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME, but $env is stamped '$stamped'"
              exit 1
            fi
          done

      - name: Stage flasher bundle
        run: |
          set -eu
          rm -rf flasher-dist && mkdir flasher-dist
          cp flasher/index.html flasher-dist/
          cp -r flasher/esp-web-tools flasher-dist/
          cp flasher/manifest.json flasher-dist/
          cp firmware/.pio/build/t-embed-cc1101/bootloader.bin flasher-dist/
          cp firmware/.pio/build/t-embed-cc1101/partitions.bin flasher-dist/
          cp firmware/.pio/build/t-embed-cc1101/firmware.bin flasher-dist/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            flasher-dist/
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          python - "$VERSION" <<'PY'
          import json, sys
          path = "flasher-dist/manifest.json"
          with open(path) as f:
              manifest = json.load(f)
          manifest["version"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      # Every image that leaves this workflow is scanned for known-private
      # literals and key material before it is published anywhere.
      - name: Scan flash images before publishing
        run: |
          set -eu
          for f in flasher-dist/*.bin; do
            host/check-secrets.sh --scan-artifact "$f"
          done

      # SHA256SUMS lists the four images that the release carries. The
      # project site checks its copies of the images against it.
      - name: Write SHA256SUMS
        run: |
          set -eu
          cd flasher-dist
          sha256sum bootloader.bin partitions.bin boot_app0.bin firmware.bin > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload flasher bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flasher
          path: flasher-dist/
          if-no-files-found: error

      - name: Attest build provenance of the images
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            flasher-dist/bootloader.bin
            flasher-dist/partitions.bin
            flasher-dist/boot_app0.bin
            flasher-dist/firmware.bin

      - name: Attach images to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A new release starts as a draft, so nobody sees it before its
          # images and SHA256SUMS are attached.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Chirp $GITHUB_REF_NAME" --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            flasher-dist/bootloader.bin \
            flasher-dist/partitions.bin \
            flasher-dist/boot_app0.bin \
            flasher-dist/firmware.bin \
            flasher-dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      # Events that the default token causes do not start other workflows,
      # except workflow_dispatch. So start the project site build here.
      - name: Publish the project site
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
