; Chirp voice terminal — T-Embed CC1101 Plus
; Vendor-pinned stack: Arduino core 2.x (espressif32@6.13.0), legacy I2S driver,
; vendored TFT_eSPI (Setup214), ESP32-audioI2S v2.0.0.

[env:t-embed-cc1101]
platform = espressif32@6.13.0
board = T_Embed_PN532
framework = arduino
board_build.partitions = default_16MB.csv
extra_scripts =
    pre:version.py
    pre:ota_build.py
    pre:build_paths.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=1

lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    ricmoo/QRCode@^0.0.1
